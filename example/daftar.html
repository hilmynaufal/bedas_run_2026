<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Layanan Dinamis & Pembayaran</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Leaflet & Plugin CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@3.11.0/dist/geosearch.css" />

    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <!-- Choices.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Offline.js Theme -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/offline-js/0.7.1/themes/offline-theme-chrome.min.css">

    <!-- Tailwind CSS JIT CDN -->
    <script src="https://cdn.tailwindcss.com"></script>


    <style>
        :root {
            --primary-600: #0f766e;
            --primary-500: #14b8a6;
            --primary-400: #2dd4bf;
            --primary-100: #ccfbf1;
            --primary-50: #f0fdfa;
            --neutral-900: #1a1a1a;
            --neutral-800: #2c2c2e;
            --neutral-700: #3a3a3c;
            --neutral-600: #48484a;
            --neutral-500: #8e8e93;
            --neutral-400: #c7c7cc;
            --neutral-300: #d1d1d6;
            --neutral-200: #e5e5ea;
            --neutral-100: #f2f2f7;
            --neutral-50: #f9f9fb;
            --accent-red: #ff3b30;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.07), 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07), 0 2px 4px rgba(0, 0, 0, 0.06);
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-2xl: 20px;
        }

        .light-theme {
            --bg-primary: #ffffff;
            --bg-secondary: var(--neutral-50);
            --bg-tertiary: var(--neutral-100);
            --text-primary: var(--neutral-900);
            --text-secondary: var(--neutral-600);
            --text-tertiary: var(--neutral-500);
            --border-primary: var(--neutral-200);
            --card-bg: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.85);
        }

        .dark-theme {
            --bg-primary: #121212;
            --bg-secondary: #000000;
            --bg-tertiary: var(--neutral-800);
            --text-primary: #ffffff;
            --text-secondary: var(--neutral-300);
            --text-tertiary: var(--neutral-400);
            --border-primary: var(--neutral-700);
            --card-bg: var(--neutral-800);
            --nav-bg: rgba(18, 18, 18, 0.85);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Custom Stepper Styles */
        .stepper-container {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .stepper-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            position: relative;
        }

        .stepper-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border: 2px solid var(--border-primary);
            background-color: var(--card-bg);
            color: var(--text-tertiary);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }

        .stepper-title {
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            color: var(--text-tertiary);
            transition: all 0.3s ease;
            line-height: 1.3;
        }

        .stepper-item:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 18px;
            left: 50%;
            width: 100%;
            height: 2px;
            background-color: var(--border-primary);
            transform: translateY(-50%);
            z-index: 1;
            transition: all 0.3s ease;
        }

        .stepper-item.active .stepper-icon {
            border-color: var(--primary-500);
            background-color: var(--primary-500);
            color: white;
        }

        .stepper-item.active .stepper-title {
            color: var(--text-primary);
        }

        .stepper-item.completed .stepper-icon {
            border-color: var(--primary-500);
            background-color: var(--primary-500);
            color: white;
        }

        .stepper-item.completed .stepper-title {
            color: var(--text-secondary);
        }

        .stepper-item.completed::after {
            background-color: var(--primary-500);
        }

        /* Custom Form Input Styles */
        .form-input {
            width: 100%;
            display: block;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 3px var(--primary-100);
        }

        .tooltip-container {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .tooltip-text {
            visibility: hidden;
            width: 250px;
            background-color: var(--neutral-800);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -125px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
            font-weight: 500;
        }

        .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: var(--neutral-800) transparent transparent transparent;
        }

        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        /* Leaflet & GeoSearch Customization */
        .leaflet-pane {
            z-index: 10;
        }

        .leaflet-top.leaflet-left {
            top: 1rem;
            left: 1rem;
        }

        .leaflet-bar a {
            background-color: var(--card-bg) !important;
            color: var(--text-secondary) !important;
            box-shadow: var(--shadow-sm);
        }

        .leaflet-bar a:hover {
            background-color: var(--bg-tertiary) !important;
        }

        .leaflet-control-layers {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
        }

        /* Kustomisasi Choices.js */
        .choices__inner {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            padding: 0.5rem 1rem;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            min-height: auto;
        }

        .choices[data-type*="select-one"] .choices__inner {
            padding-bottom: 0.5rem;
        }

        .choices__list--dropdown {
            background-color: var(--card-bg);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            z-index: 20;
        }

        .choices__input {
            background-color: transparent;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .choices__item {
            font-weight: 500;
        }

        .choices__item--selectable {
            color: var(--text-secondary);
        }

        .choices__list--dropdown .choices__item--selectable.is-highlighted {
            background-color: var(--primary-50);
            color: var(--primary-600);
        }

        .dark-theme .choices__list--dropdown .choices__item--selectable.is-highlighted {
            background-color: var(--neutral-700);
            color: var(--text-primary);
        }

        .choices[data-type*="select-one"]::after {
            border-color: var(--text-tertiary) transparent transparent;
            margin-top: -5px;
            right: 1.25rem;
        }

        .choices.is-open[data-type*="select-one"]::after {
            border-color: transparent transparent var(--text-tertiary);
            margin-top: -7.5px;
        }

        .choices__list--dropdown .choices__placeholder,
        .choices__list--single .choices__placeholder {
            color: var(--text-tertiary);
            opacity: 1;
        }

        /* Popup Styles */
        #info-popup.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #info-popup.visible #popup-content {
            transform: scale(1);
        }

        /* Shimmer Animation */
        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .shimmer-bg {
            position: relative;
            overflow: hidden;
            background-color: var(--bg-tertiary);
        }

        .shimmer-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 1.5s infinite;
        }

        .dark-theme .shimmer-bg::after {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
        }
    </style>
</head>

<body class="light-theme">
    <div id="top-loader" class="fixed top-0 left-0 w-full h-1 z-[101] bg-transparent hidden">
        <div id="loader-bar" class="h-full bg-gradient-to-r from-[var(--primary-400)] to-[var(--primary-500)]"
            style="width: 0%;"></div>
    </div>
    <div class="app-container min-h-screen">
        <header class="sticky top-0 z-50 bg-[var(--nav-bg)] backdrop-blur-xl border-b border-[var(--border-primary)]">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16 sm:h-20">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-10 h-10 bg-gradient-to-br from-[var(--primary-400)] to-[var(--primary-500)] rounded-lg flex items-center justify-center">
                            <i data-lucide="file-signature" class="text-white"></i>
                        </div>
                        <h1 id="form-title" class="text-lg sm:text-xl font-bold text-[var(--text-primary)]">Formulir
                            Pendaftaran</h1>
                    </div>
                    <button
                        class="w-10 h-10 flex items-center justify-center bg-[var(--bg-tertiary)] rounded-lg text-[var(--text-secondary)]"
                        id="theme-toggle"><i data-lucide="moon"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-grow">
            <div class="max-w-3xl mx-auto p-4 sm:p-6 pb-24">
                <div id="loading-placeholder">
                    <div class="flex justify-between items-center mb-8">
                        <div class="h-14 w-1/4 shimmer-bg rounded-lg"></div>
                        <div class="h-14 w-1/4 shimmer-bg rounded-lg"></div>
                        <div class="h-14 w-1/4 shimmer-bg rounded-lg"></div>
                    </div>
                    <div class="h-8 w-3/5 shimmer-bg rounded-md mb-2"></div>
                    <div class="h-5 w-4/5 shimmer-bg rounded-md mb-8"></div>
                    <div class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="h-16 shimmer-bg rounded-lg"></div>
                            <div class="h-16 shimmer-bg rounded-lg"></div>
                        </div>
                        <div class="h-32 shimmer-bg rounded-lg"></div>
                    </div>
                </div>

                <div id="form-wrapper" class="hidden">
                    <div id="stepper-indicator" class="mb-8"></div>

                    <div id="form-container"
                        class="bg-[var(--card-bg)] p-5 sm:p-8 rounded-[var(--radius-2xl)] shadow-[var(--shadow-md)] border border-[var(--border-primary)]">
                        <div id="success-message" class="hidden">
                            <div class="flex flex-col items-center justify-center text-center py-12">
                                <div
                                    class="w-20 h-20 bg-[var(--primary-50)] rounded-full flex items-center justify-center">
                                    <i data-lucide="check-circle-2" class="w-12 h-12 text-[var(--primary-500)]"></i>
                                </div>
                                <h2 class="text-3xl font-extrabold mt-6 text-[var(--text-primary)]">Pendaftaran
                                    Berhasil!</h2>
                                <p class="text-[var(--text-secondary)] mt-2 max-w-md">Data Anda berhasil dikirim. Jika
                                    pembayaran belum dilakukan, mohon hubungi pihak panitia.</p>
                            </div>
                        </div>
                        <form id="dynamic-form" novalidate></form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Popup Info -->
    <div id="info-popup"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="popup-content"
            class="bg-[var(--card-bg)] w-full max-w-md p-6 sm:p-8 rounded-[var(--radius-2xl)] shadow-[var(--shadow-md)] border border-[var(--border-primary)] transform scale-95 transition-transform duration-300">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 id="popup-title" class="text-xl sm:text-2xl font-bold text-[var(--text-primary)]"></h2>
                    <p id="popup-description" class="text-base text-[var(--text-secondary)] mt-2"></p>
                </div>
                <button id="close-popup"
                    class="text-[var(--text-tertiary)] hover:text-[var(--text-primary)] transition-colors flex-shrink-0 ml-4">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="mt-6 flex flex-col sm:flex-row-reverse sm:items-center sm:justify-between gap-4">

                <div class="flex items-center">
                    <input type="checkbox" id="dont-show-again" name="dont-show-again"
                        class="h-5 w-5 rounded border-[var(--neutral-400)] text-[var(--primary-600)] focus:ring-[var(--primary-500)]">
                    <label for="dont-show-again" class="ml-2 text-sm text-[var(--text-secondary)]">Jangan tampilkan
                        lagi</label>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Floating Navbar -->
    <div id="mobile-nav"
        class="hidden fixed bottom-0 left-0 right-0 bg-[var(--nav-bg)] backdrop-blur-xl shadow-[0_-2px_10px_rgba(0,0,0,0.08)] p-3 border-t border-[var(--border-primary)] z-40"
        style="padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));">
        <div class="flex justify-between items-center max-w-md mx-auto gap-4">
            <button type="button" id="mobilePrevBtn"
                class="py-3 px-4 rounded-[var(--radius-lg)] font-bold text-[var(--text-secondary)] bg-[var(--bg-tertiary)] hover:bg-[var(--neutral-200)] transition-all flex-shrink-0">Kembali</button>
            <div id="mobile-step-indicator"
                class="text-sm font-semibold text-[var(--text-secondary)] whitespace-nowrap"></div>
            <button type="button" id="mobileNextBtn"
                class="flex-grow py-3 px-4 rounded-[var(--radius-lg)] font-bold text-white bg-gradient-to-r from-[var(--primary-500)] to-[var(--primary-600)] hover:opacity-90 transition-opacity flex items-center justify-center"></button>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-geosearch@3.11.0/dist/geosearch.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/offline-js/0.7.1/offline.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/id.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

    <script>
        // === KONFIGURASI BACKEND (global scope) ===
        const BACKEND_URL = "https://api.bigandchildrun.com";

        // ─── TAMPILKAN INFO TRANSFER BANK ────────────────────────────────────────
        // Harus global — dipanggil dari onclick di HTML yang digenerate secara dinamis
        function showBankTransferInfo(payData) {
            const fmt = (n) => new Intl.NumberFormat('id-ID').format(n);
            const container = document.getElementById('form-container');
            container.innerHTML = `
                <div class="max-w-lg mx-auto py-8 px-2">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 bg-teal-100 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i data-lucide="banknote" class="w-8 h-8 text-teal-600"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold text-[var(--text-primary)]">Pendaftaran Berhasil!</h2>
                        <p class="text-[var(--text-secondary)] mt-1 text-sm">Selesaikan pembayaran dengan transfer bank di bawah ini</p>
                    </div>

                    <!-- Info rekening -->
                    <div class="bg-teal-50 border border-teal-200 rounded-2xl p-5 mb-5">
                        <p class="text-xs font-semibold text-teal-700 uppercase tracking-wide mb-3">Rekening Tujuan</p>
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between">
                                <span class="text-gray-500">Bank</span>
                                <span class="font-bold text-gray-800">${payData.bank.name}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-500">No. Rekening</span>
                                <span class="font-bold text-gray-800 font-mono tracking-wider">${payData.bank.accountNumber}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-500">Atas Nama</span>
                                <span class="font-bold text-gray-800">${payData.bank.accountName}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Nominal transfer -->
                    <div class="bg-white border-2 border-teal-400 rounded-2xl p-5 mb-5 text-center shadow-sm">
                        <p class="text-xs font-semibold text-teal-700 uppercase tracking-wide mb-1">Transfer TEPAT sebesar</p>
                        <p class="text-4xl font-extrabold text-teal-600">Rp ${fmt(payData.totalTransfer)}</p>
                        <p class="text-xs text-gray-400 mt-1">
                            (Harga Rp ${fmt(payData.amount)} + kode unik <strong>${String(payData.uniqueCode).padStart(3, '0')}</strong>)
                        </p>
                        <p class="text-xs text-orange-500 font-semibold mt-2">⚠ Nominal harus TEPAT agar verifikasi berjalan otomatis</p>
                    </div>

                    <div class="text-center mb-5">
                        <p class="text-sm font-semibold text-gray-700">
                            Batas pendaftaran dan pembayaran sampai tanggal <strong class="text-red-500">Minggu, 12 April 2026 23:59</strong>
                        </p>
                    </div>

                    <!-- No referensi -->
                    <div class="bg-gray-50 border border-gray-200 rounded-xl p-3 mb-5 text-center text-sm">
                        <span class="text-gray-500">No. Pendaftaran: </span>
                        <span class="font-bold font-mono text-gray-800">${payData.referenceId}</span>
                    </div>

                    <!-- Langkah -->
                    <div class="text-sm text-gray-600 mb-6 space-y-2">
                        <p class="font-semibold text-gray-700">Langkah selanjutnya:</p>
                        <ol class="list-decimal list-inside space-y-1 text-gray-600">
                            <li>Transfer ke rekening di atas dengan nominal <strong>TEPAT</strong></li>
                            <li>Ambil screenshot/foto bukti transfer</li>
                            <li>Upload bukti di form bawah ini</li>
                            <li>Tunggu konfirmasi dari panitia (maks 1×24 jam)</li>
                        </ol>
                    </div>

                    <!-- Upload bukti -->
                    <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm">
                        <p class="font-semibold text-gray-700 mb-3 text-sm">Upload Bukti Transfer</p>
                        <div id="upload-area" class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center cursor-pointer hover:border-teal-400 transition-colors" onclick="document.getElementById('proof-file').click()">
                            <i data-lucide="upload-cloud" class="w-10 h-10 text-gray-400 mx-auto mb-2"></i>
                            <p class="text-sm text-gray-500">Klik atau drag foto bukti transfer</p>
                            <p class="text-xs text-gray-400 mt-1">JPG, PNG, WEBP — maks 5 MB</p>
                        </div>
                        <input type="file" id="proof-file" accept="image/*" class="hidden" onchange="previewProofFile(this)">
                        <div id="preview-wrapper" class="hidden mt-3">
                            <img id="proof-preview" class="max-h-48 mx-auto rounded-lg border border-gray-200" alt="Preview">
                            <p id="proof-filename" class="text-xs text-center text-gray-400 mt-1"></p>
                        </div>
                        <button id="upload-btn" onclick="uploadProof('${payData.referenceId}')" disabled
                            class="mt-4 w-full py-3 rounded-xl font-bold text-white bg-teal-500 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-teal-600 transition text-sm">
                            Kirim Bukti Transfer
                        </button>
                        <div id="upload-status" class="mt-3 text-center text-sm hidden"></div>
                    </div>

                    <p class="text-center text-xs text-gray-400 mt-6">
                        Sudah mendaftar tapi halaman ter-refresh? <a href="upload.html" class="text-teal-600 font-semibold underline">Buka halaman upload bukti</a>
                    </p>
                </div>
            `;
            lucide.createIcons();
            document.getElementById('mobile-nav').classList.add('hidden');
        }

        // Dipanggil dari onchange di input file (harus global)
        function previewProofFile(input) {
            if (!input.files.length) return;
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('proof-preview').src = e.target.result;
                document.getElementById('proof-filename').textContent = file.name;
                document.getElementById('preview-wrapper').classList.remove('hidden');
                document.getElementById('upload-area').classList.add('hidden');
            };
            reader.readAsDataURL(file);
            document.getElementById('upload-btn').disabled = false;
        }

        // ─── UPLOAD BUKTI TRANSFER (global) ─────────────────────────────────────
        // Harus global — dipanggil dari onclick di HTML yang digenerate secara dinamis
        async function uploadProof(referenceId) {
            const fileInput = document.getElementById('proof-file');
            const btn = document.getElementById('upload-btn');
            const statusEl = document.getElementById('upload-status');
            if (!fileInput.files.length) return;

            btn.disabled = true;

            function initializePlugins(stepNum) {
                const currentStepElement = document.querySelector(`.form-step[data-step-id="${stepNum}"]`);
                if (!currentStepElement) return;

                currentStepElement.querySelectorAll('.date-picker').forEach(input => {
                    if (input._flatpickr) return;
                    flatpickr(input, { locale: "id", dateFormat: "d/m/Y", altInput: true, altFormat: "d/m/Y" });
                });

                currentStepElement.querySelectorAll('select.form-input').forEach(selectEl => {
                    const qId = selectEl.dataset.questionId;
                    if (!qId || choicesInstances[qId]) return;
                    choicesInstances[qId] = new Choices(selectEl, {
                        searchEnabled: true, placeholder: true, allowHTML: false,
                        itemSelectText: 'Tekan enter untuk memilih',
                        noResultsText: 'Tidak ada hasil ditemukan', noChoicesText: 'Tidak ada pilihan lagi',
                        sorter: (a, b) => {
                            if (a.placeholder) return -1; if (b.placeholder) return 1;
                            return a.label.localeCompare(b.label);
                        },
                    });
                });

                currentStepElement.querySelectorAll('.map-container').forEach(mapContainer => {
                    const qId = mapContainer.id.split('-')[1];
                    if (maps[qId]) { maps[qId].invalidateSize(); return; }

                    const qData = apiData.data.find(q => q.id == qId);
                    const hiddenInput = document.querySelector(`input[data-question-id="${qId}"]`);
                    const lat = qData.options?.lat || -6.9175; const lng = qData.options?.lng || 107.6191;

                    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' });
                    const map = L.map(mapContainer, { layers: [osm] }).setView([lat, lng], 18);
                    maps[qId] = map;

                    const marker = L.marker([lat, lng], { draggable: true }).addTo(map);
                    const updateMapValue = (latlng) => {
                        hiddenInput.value = `${latlng.lat}, ${latlng.lng}`;
                        hiddenInput.dispatchEvent(new Event('input', { bubbles: true }));
                        marker.bindPopup(`<b>Koordinat:</b><br>${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`).openPopup();
                    };
                    updateMapValue(marker.getLatLng());

                    marker.on('dragend', e => updateMapValue(e.target.getLatLng()));
                    map.on('click', e => { marker.setLatLng(e.latlng); updateMapValue(e.latlng); });
                });
            }

                    s.classList.toggle('-translate-x-8', !isActive); s.classList.toggle('pointer-events-none', !isActive);
                    s.classList.toggle('absolute', !isActive);

                document.getElementById('mobilePrevBtn').classList.toggle('invisible', currentStep <= 1);

                if (dynamicSteps[currentStep - 1]?.isReviewStep) {

            function validateAllFieldsAndNavigate() {
                document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
                let firstInvalidStep = -1;

                for (let i = 0; i < dynamicSteps.length; i++) {
                    const stepIndex = i + 1;
                    const step = dynamicSteps[i];
                    let isStepValid = true;

                    if (step.isReviewStep) {
                        const declarationCheckboxes = form.querySelectorAll(`.form-step[data-step-id="${stepIndex}"] .declaration-checkbox`);
                        const allChecked = Array.from(declarationCheckboxes).every(cb => cb.checked);

                        if (!allChecked) {
                            isStepValid = false;
                            const errorMsgEl = form.querySelector(`.form-step[data-step-id="${stepIndex}"] .form-group .error-message`);
                            if (errorMsgEl) errorMsgEl.textContent = 'Anda harus menyetujui semua pernyataan.';
                        }
                    } else {
                        const fieldsToValidate = document.querySelectorAll(`.form-step[data-step-id="${stepIndex}"] input[required], .form-step[data-step-id="${stepIndex}"] select[required], .form-step[data-step-id="${stepIndex}"] textarea[required]`);
                        const validatedGroups = new Set();

                        fieldsToValidate.forEach(field => {
                            const fieldGroup = field.closest('.form-group');
                            const errorMsgEl = fieldGroup?.querySelector('.error-message');
                            if (!errorMsgEl) return;

                            const groupName = field.name;
                            if ((field.type === 'radio' || field.type === 'checkbox')) {
                                if (validatedGroups.has(groupName)) return;
                                validatedGroups.add(groupName);
                            }

                            let errorMessage = '';
                            if (field.type === 'radio' || field.type === 'checkbox') {
                                if (!form.querySelector(`input[name="${groupName}"]:checked`)) errorMessage = 'Wajib diisi.';
                            } else if (field.type === 'file') {
                                if (field.files.length === 0) errorMessage = 'Wajib diunggah.';
                            } else if (!field.value.trim()) {
                                errorMessage = 'Wajib diisi.';
                            }

                            if (errorMessage) {
                                errorMsgEl.textContent = errorMessage;
                                isStepValid = false;
                            }
                        });
                    }

                    if (!isStepValid && firstInvalidStep === -1) firstInvalidStep = stepIndex;
                }

                if (firstInvalidStep !== -1) { currentStep = firstInvalidStep; updateUI(); return false; }
                return true;
            }

            function updateSubmitButtonState() {

                if (currentStep !== totalSteps) return;

                mobileSubmitBtn.disabled = !allChecked;
                mobileSubmitBtn.classList.toggle('opacity-50', !allChecked);
                mobileSubmitBtn.classList.toggle('cursor-not-allowed', !allChecked);
            }

            function validateCurrentStep() {
                if (dynamicSteps[currentStep - 1]?.isReviewStep) return true; // simplified for dynamic check
                return true;
            }

            async function handleFormSubmit() {
                if (Offline.state === 'down') {
                    alert('Koneksi terputus. Mohon periksa internet Anda.');
                    return;
                }

                const mobileSubmitBtn = document.getElementById('mobileNextBtn');
                const mobilePrevBtn = document.getElementById('mobilePrevBtn');
                const originalText = mobileSubmitBtn.textContent;

                const formElements = form.querySelectorAll('input, select, textarea');
                formElements.forEach(el => el.disabled = true);
                mobilePrevBtn.disabled = true;
                mobileSubmitBtn.disabled = true;
                mobileSubmitBtn.innerHTML = loadingSpinner;

                if (!validateAllFieldsAndNavigate()) {
                    formElements.forEach(el => el.disabled = false);
                    mobilePrevBtn.disabled = false;
                    mobileSubmitBtn.innerHTML = originalText;
                    mobileSubmitBtn.disabled = false;
                    updateSubmitButtonState();
                    return;
                }

                const topLoader = document.getElementById('top-loader');
                const loaderBar = document.getElementById('loader-bar');
                topLoader.classList.remove('hidden');
                loaderBar.style.width = '0%';
                setTimeout(() => { loaderBar.style.transition = 'width 4s cubic-bezier(0.25, 1, 0.5, 1)'; loaderBar.style.width = '95%'; }, 100);

                const formData = new FormData();
                apiData.data.forEach(question => {
                    const fieldName = toKebabCase(question.question_text);
                    const el = form.querySelector(`[data-question-id="${question.id}"]`);
                    if (question.question_type === 'radio') { const checked = form.querySelector(`input[name="${fieldName}"]:checked`); if (checked) formData.append(`answers[${question.id}]`, checked.value); }
                    else if (question.question_type === 'checkbox') { form.querySelectorAll(`input[name="${fieldName}"]:checked`).forEach(cb => formData.append(`answers[${question.id}][]`, cb.value)); }
                    else if (['file', 'image'].includes(question.question_type)) { if (el && el.files.length > 0) formData.append(`answers[${question.id}]`, el.files[0]); }
                    else { if (el && el.value?.trim()) formData.append(`answers[${question.id}]`, el.value); }
                });
                form.querySelectorAll('.declaration-checkbox:checked').forEach(checkbox => { formData.append(checkbox.name, 'disetujui'); });

                // Capture surat pernyataan sebelum form berubah (id field API = 2772, opsional)
                const suratEl = form.querySelector('[data-question-id="2772"]');
                const suratFile = (suratEl && suratEl.files && suratEl.files.length > 0) ? suratEl.files[0] : null;

                // Kumpulkan jawaban form sebagai plain object untuk disimpan ke Supabase
                const formAnswers = {};
                apiData.data.forEach(question => {
                    if (['file', 'image'].includes(question.question_type)) return;
                    const fieldName = toKebabCase(question.question_text);
                    const el = form.querySelector(`[data-question-id="${question.id}"]`);
                    if (question.question_type === 'radio') {
                        const checked = form.querySelector(`input[name="${fieldName}"]:checked`);
                        if (checked) formAnswers[question.question_text] = checked.value;
                    } else if (question.question_type === 'checkbox') {
                        const checked = form.querySelectorAll(`input[name="${fieldName}"]:checked`);
                        if (checked.length > 0) formAnswers[question.question_text] = Array.from(checked).map(cb => cb.value);
                    } else {
                        if (el && el.value?.trim()) formAnswers[question.question_text] = el.value.trim();
                    }
                });

                // Ekstrak buyer info dari field yang diketahui
                const buyerName = formAnswers['Nama Lengkap'] || '';
                const buyerPhone = formAnswers['Nomor Whatsapp Aktif'] || '';
                const buyerEmail = formAnswers['Email'] || '';

                try {
                    // SUBMIT_URL (Bandung API) dinonaktifkan sementara
                    // const response = await fetch(SUBMIT_URL, { method: 'POST', body: formData });
                    const responseData = null;

                    // ==========================================
                    //  PEMBAYARAN VIA BACKEND
                    // ==========================================

                    document.getElementById('form-container').innerHTML = `
                        <div class="flex flex-col items-center justify-center text-center py-12 animate-pulse">
                             <i data-lucide="loader-2" class="animate-spin w-14 h-14 text-[var(--primary-500)] mb-4"></i>
                             <h2 class="text-2xl sm:text-3xl font-extrabold text-[var(--text-primary)]">Memproses Pendaftaran...</h2>
                             <p class="text-[var(--text-secondary)] mt-2">Mohon tunggu sebentar.</p>
                        </div>
                    `;
                    lucide.createIcons();
                    mobileNav.classList.add('hidden');

                    const payRes = await fetch(`${BACKEND_URL}/payment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            buyerName,
                            buyerPhone,
                            buyerEmail,
                            formData: formAnswers,
                        })
                    });

                    const payData = await payRes.json();

                    loaderBar.style.transition = 'width 0.3s ease-in-out';
                    loaderBar.style.width = '100%';
                    setTimeout(() => { topLoader.classList.add('hidden'); }, 400);

                    // Nomor HP sudah terdaftar
                    if (payRes.status === 409) {
                        document.getElementById('form-container').innerHTML = `
                            <div class="flex flex-col items-center justify-center text-center py-12">
                                <i data-lucide="circle-alert" class="w-14 h-14 text-red-500 mb-4"></i>
                                <h2 class="text-2xl sm:text-3xl font-extrabold text-[var(--text-primary)]">Nomor HP Sudah Terdaftar</h2>
                                <p class="text-[var(--text-secondary)] mt-2">${payData.detail || payData.error}</p>
                                <a href="check.html" class="mt-6 px-6 py-3 bg-[var(--primary-500)] text-white rounded-xl font-semibold hover:opacity-90 transition">
                                    Cek Status Pendaftaran
                                </a>
                            </div>
                        `;
                        lucide.createIcons();
                        mobileNav.classList.add('hidden');
                        return;
                    }

                    // Kuota pendaftaran penuh
                    if (payRes.status === 429) {
                        document.getElementById('form-container').innerHTML = `
                            <div class="flex flex-col items-center justify-center text-center py-12">
                                <i data-lucide="users" class="w-14 h-14 text-red-500 mb-4"></i>
                                <h2 class="text-2xl sm:text-3xl font-extrabold text-[var(--text-primary)]">Pendaftaran Ditutup</h2>
                                <p class="text-[var(--text-secondary)] mt-2">${payData.detail || payData.error}</p>
                            </div>
                        `;
                        lucide.createIcons();
                        mobileNav.classList.add('hidden');
                        return;
                    }

                    // Pendaftaran berhasil — upload surat (opsional, non-blocking) lalu tampilkan info transfer
                    if (payRes.ok && payData.referenceId) {
                        if (suratFile) {
                            const suratForm = new FormData();
                            suratForm.append('referenceId', payData.referenceId);
                            suratForm.append('surat', suratFile);
                            fetch(`${BACKEND_URL}/upload-surat`, { method: 'POST', body: suratForm })
                                .catch(err => console.warn('[surat] Upload opsional gagal:', err.message));
                        }
                        showBankTransferInfo(payData);
                        return;
                    }

                    throw new Error(payData.error || payData.detail || "Terjadi kesalahan pada server.");

                } catch (error) {
                    console.error('Submit/Payment Error:', error);
                    loaderBar.style.transition = 'width 0.3s ease-in-out';
                    loaderBar.style.width = '100%';
                    setTimeout(() => { topLoader.classList.add('hidden'); }, 400);

                    document.getElementById('form-container').innerHTML = `
                        <div class="flex flex-col items-center justify-center text-center py-12">
                            <i data-lucide="circle-alert" class="w-14 h-14 text-red-500 mb-4"></i>
                            <h2 class="text-2xl sm:text-3xl font-extrabold text-[var(--text-primary)]">Terjadi Kesalahan</h2>
                            <p class="text-[var(--text-secondary)] mt-2">${error.message}</p>
                            <button onclick="location.reload()" class="mt-6 px-6 py-3 bg-[var(--primary-500)] text-white rounded-xl font-semibold hover:opacity-90 transition">
                                Coba Lagi
                            </button>
                        </div>
                    `;
                    lucide.createIcons();
                    formElements.forEach(el => el.disabled = false);
                    mobilePrevBtn.disabled = false;
                    mobileSubmitBtn.innerHTML = originalText;
                    mobileSubmitBtn.disabled = false;
                    updateSubmitButtonState();
                }
            }

            const updateDependentDropdown = (parentSelect) => {
                const parentQuestionId = parentSelect.dataset.questionId;
                const childSelect = form.querySelector(`select[data-depends-on="${parentQuestionId}"]`);
                if (!childSelect) return;

                const childQuestionId = childSelect.dataset.questionId;
                const childChoiceInstance = choicesInstances[childQuestionId];
                if (!childChoiceInstance) return;

                const parentQuestion = apiData.data.find(q => q.id == parentQuestionId);
                const childQuestion = apiData.data.find(q => q.id == childQuestionId);
                const findParentQuestionText = (parentId) => (apiData.data.find(q => q.id == parentId) || {}).question_text || '';

                const selectedParentOption = parentQuestion.options.find(opt => opt.option_text === parentSelect.value);

                if (selectedParentOption) {
                    const filteredOptions = childQuestion.options.filter(opt => opt.parent_option_id == selectedParentOption.id);
                    filteredOptions.sort((a, b) => a.option_text.localeCompare(b.option_text));
                    const choicesArray = filteredOptions.map(opt => ({ value: opt.option_text, label: opt.option_text }));
                    childChoiceInstance.enable();
                    childChoiceInstance.setChoices([{ value: '', label: 'Pilih salah satu...', placeholder: true }, ...choicesArray], 'value', 'label', true);
                } else {
                    childChoiceInstance.disable();
                    childChoiceInstance.setChoices([{ value: '', label: `Pilih ${findParentQuestionText(parentQuestionId)} dahulu`, placeholder: true }], 'value', 'label', true);
                }
            };

            function updateConnectivityStatus() {
                const mobileNextBtn = document.getElementById('mobileNextBtn');
                if (!mobileNextBtn) return;

                if (Offline.state === 'down') {
                    mobileNextBtn.disabled = true; mobileNextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    if (currentStep === totalSteps) updateSubmitButtonState();
                    else { mobileNextBtn.disabled = false; mobileNextBtn.classList.remove('opacity-50', 'cursor-not-allowed'); }
                }
            }

            mobileNav.addEventListener('click', async e => {
                const button = e.target.closest('button');
                if (!button) return;

                if (button.id === 'mobileNextBtn') {
                    const mobileNextBtn = document.getElementById('mobileNextBtn');
                    const originalText = mobileNextBtn.textContent;
                    mobileNextBtn.disabled = true; mobileNextBtn.innerHTML = loadingSpinner;

                    if (currentStep === totalSteps) {
                        await handleFormSubmit();
                    } else {
                        if (validateCurrentStep()) { currentStep++; updateUI(); }
                        mobileNextBtn.disabled = false; mobileNextBtn.innerHTML = ''; mobileNextBtn.textContent = originalText;
                        updateUI();
                    }
                }
                else if (button.id === 'mobilePrevBtn') {
                    if (currentStep > 1) { currentStep--; updateUI(); }
                }
            });

            form.addEventListener('input', e => {
                const target = e.target;
                if (target.classList.contains('declaration-checkbox')) {
                    updateSubmitButtonState(); validateCurrentStep();
                } else if (target.type !== 'file') { validateCurrentStep(); }
            });

            form.addEventListener('change', e => {
                if (e.target.tagName === 'SELECT') { updateDependentDropdown(e.target); }
                // Preview nama file saat file dipilih di field surat/file dinamis
                if (e.target.type === 'file') {
                    const wrapper = e.target.closest('.file-upload-wrapper');
                    if (wrapper) {
                        const preview = wrapper.nextElementSibling; // .file-preview div
                        const ui = wrapper.querySelector('.file-upload-ui');
                        if (e.target.files && e.target.files.length > 0) {
                            const f = e.target.files[0];
                            if (preview) preview.innerHTML = `<span class="flex items-center gap-1.5 text-xs text-[var(--primary-600)] font-medium"><i data-lucide="file-check-2" class="w-3.5 h-3.5"></i>${f.name}</span>`;
                            if (ui) ui.classList.add('border-[var(--primary-400)]', 'bg-[var(--primary-50)]');
                            lucide.createIcons();
                        } else {
                            if (preview) preview.innerHTML = '';
                            if (ui) ui.classList.remove('border-[var(--primary-400)]', 'bg-[var(--primary-50)]');
                        }
                    }
                }
                validateCurrentStep();
            });

            // Event delegation: klik .file-upload-ui → trigger hidden file input
            form.addEventListener('click', e => {
                const ui = e.target.closest('.file-upload-ui');
                if (ui) {
                    const wrapper = ui.closest('.file-upload-wrapper');
                    if (wrapper) {
                        const input = wrapper.querySelector('input[type="file"]');
                        if (input) input.click();
                    }
                }
            });

            // Theme Toggle
            const themeToggle = document.getElementById('theme-toggle');
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.className = savedTheme + '-theme';

            function updateThemeIcon(theme) {
                themeToggle.innerHTML = `<i data-lucide="${theme === 'light' ? 'moon' : 'sun'}"></i>`;
                lucide.createIcons();
            }
            updateThemeIcon(savedTheme);

            themeToggle.addEventListener('click', () => {
                const newTheme = document.body.classList.contains('light-theme') ? 'dark' : 'light';
                document.body.className = newTheme + '-theme';
                localStorage.setItem('theme', newTheme);
                updateThemeIcon(newTheme);
            });

            function showPopup() {
                if (!apiData || !apiData.title) return;
                const popupKey = `hidePopup-${toKebabCase(apiData.title)}`;
                if (localStorage.getItem(popupKey) === 'true') return;
                popupTitle.textContent = apiData.title; popupDescription.textContent = apiData.description;
                infoPopup.classList.add('visible'); lucide.createIcons();
            }

            function closePopup() {
                if (dontShowAgainCheckbox.checked) localStorage.setItem(`hidePopup-${toKebabCase(apiData.title)}`, 'true');
                infoPopup.classList.remove('visible');
            }
            closePopupButton.addEventListener('click', closePopup); confirmPopupButton.addEventListener('click', closePopup);

            function showStatusMessage(title, message, icon = 'info') {
                loadingPlaceholder.classList.add('hidden'); formWrapper.classList.remove('hidden');
                let iconColorClass = 'text-[var(--text-tertiary)]';
                if (icon === 'users' || icon === 'alert-triangle') iconColorClass = 'text-[var(--accent-red)]';
                formWrapper.innerHTML = `
                    <div class="bg-[var(--card-bg)] p-5 sm:p-8 rounded-[var(--radius-2xl)] shadow-[var(--shadow-md)] border border-[var(--border-primary)]">
                        <div class="flex flex-col items-center justify-center text-center py-12">
                            <div class="w-20 h-20 bg-[var(--bg-tertiary)] rounded-full flex items-center justify-center">
                                <i data-lucide="${icon}" class="w-12 h-12 ${iconColorClass}"></i>
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-extrabold mt-6 text-[var(--text-primary)]">${title}</h2>
                            <p class="text-[var(--text-secondary)] mt-2 max-w-md">${message}</p>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }

            async function init() {
                const formApiData = await fetchData();
                apiData = formApiData;

                if (!apiData || !apiData.data) {
                    showStatusMessage('Mohon tunggu beberapa saat', 'Refresh untuk reload halaman ini.', 'alert-triangle');
                    return;
                }

                loadingPlaceholder.classList.add('hidden');
                formWrapper.classList.remove('hidden');

                dynamicSteps = createDynamicSteps(apiData.data, FIELDS_PER_STEP);
                if (dynamicSteps.length > 0) {
                    generateUI(); mobileNav.classList.remove('hidden'); showPopup();
                    Offline.on('up', updateConnectivityStatus); Offline.on('down', updateConnectivityStatus);
                    setTimeout(updateConnectivityStatus, 500);
                }
            }

            init();
        });
    </script>
</body>

</html>
